<!doctype html>
<html>
<head><meta charset="utf-8"><title>LastWave Jam Host</title></head>
<body>
<script>
// Hidden WebView2 page: turns the app's PCM (over a loopback WebSocket from
// Dart) into one WebRTC audio track and sends it peer-to-peer to each
// browser guest. Signaling goes through Dart -> Jam server; audio never does.
(function () {
  'use strict';
  var RATE = 48000, CH = 2, MAX_BITRATE = 128000, MAX_PEERS = 30;
  var ICE = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
  var ws = new WebSocket('ws://' + location.host + '/pcm' + location.search);
  ws.binaryType = 'arraybuffer';
  var peers = {}; // guest id -> RTCPeerConnection

  function ctl(msg) { if (ws.readyState === 1) ws.send(JSON.stringify(msg)); }

  if (typeof MediaStreamTrackGenerator !== 'function') {
    ws.onopen = function () { ctl({ t: 'error', message: 'This WebView2 runtime cannot stream audio. Update Microsoft Edge WebView2.' }); };
    return;
  }
  var gen = new MediaStreamTrackGenerator({ kind: 'audio' });
  var stream = new MediaStream([gen]);
  var writer = gen.writable.getWriter();
  var ts = 0;

  function connectedCount() {
    var n = 0;
    for (var id in peers) if (peers[id].connectionState === 'connected') n++;
    return n;
  }
  function report() { ctl({ t: 'peers', connected: connectedCount(), total: Object.keys(peers).length }); }

  function pushPcm(buf) {
    var frames = buf.byteLength / (2 * CH);
    // Nobody listening (or the encoder is backed up): drop, don't queue.
    if (!frames || !Object.keys(peers).length || writer.desiredSize <= 0) return;
    writer.write(new AudioData({ format: 's16', sampleRate: RATE, numberOfFrames: frames, numberOfChannels: CH, timestamp: ts, data: buf }));
    ts += Math.round(frames * 1e6 / RATE);
  }

  function close(id, tell, reason) {
    var pc = peers[id];
    if (!pc) return;
    delete peers[id];
    try { pc.close(); } catch (e) {}
    if (tell) ctl({ t: 'signal', to: id, data: { kind: 'bye', reason: reason || '' } });
    report();
  }

  // Opus stereo with the browser cap; munging fmtp is allowed by Chromium.
  function stereoOpus(sdp) {
    var m = /a=rtpmap:(\d+) opus\/48000\/2/i.exec(sdp);
    if (!m) return sdp;
    return sdp.replace(new RegExp('a=fmtp:' + m[1] + ' ([^\\r\\n]*)'), function (line, params) {
      return /stereo=1/.test(params) ? line : line + ';stereo=1;sprop-stereo=1;maxaveragebitrate=' + MAX_BITRATE;
    });
  }

  function iceDone(pc) {
    return new Promise(function (resolve) {
      if (pc.iceGatheringState === 'complete') return resolve();
      var t = setTimeout(resolve, 3000);
      pc.addEventListener('icegatheringstatechange', function () { if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); } });
    });
  }

  function hello(id) {
    close(id, false);
    if (Object.keys(peers).length >= MAX_PEERS) return ctl({ t: 'signal', to: id, data: { kind: 'bye', reason: 'busy' } });
    var pc = new RTCPeerConnection({ iceServers: ICE });
    peers[id] = pc;
    var sender = pc.addTrack(gen, stream);
    pc.onconnectionstatechange = function () {
      if (peers[id] !== pc) return;
      // A guest whose network blocks P2P fails alone; nobody else is touched.
      if (pc.connectionState === 'failed' || pc.connectionState === 'closed') close(id, false);
      else report();
    };
    pc.createOffer()
      .then(function (offer) { return pc.setLocalDescription({ type: 'offer', sdp: stereoOpus(offer.sdp) }); })
      .then(function () { return iceDone(pc); })
      .then(function () {
        if (peers[id] !== pc) return;
        ctl({ t: 'signal', to: id, data: { kind: 'offer', sdp: pc.localDescription.sdp } });
        var p = sender.getParameters();
        if (p.encodings && p.encodings.length) { p.encodings[0].maxBitrate = MAX_BITRATE; sender.setParameters(p).catch(function () {}); }
      })
      .catch(function () { close(id, true); });
    report();
  }

  function answer(id, sdp) {
    var pc = peers[id];
    if (!pc || !sdp) return;
    pc.setRemoteDescription({ type: 'answer', sdp: sdp }).catch(function () { close(id, true); });
  }

  ws.onmessage = function (ev) {
    if (typeof ev.data !== 'string') return pushPcm(ev.data);
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === 'stop') { Object.keys(peers).forEach(function (id) { close(id, true); }); return; }
    if (m.t !== 'signal' || !m.from || !m.data) return;
    if (m.data.kind === 'hello') hello(m.from);
    else if (m.data.kind === 'answer') answer(m.from, m.data.sdp);
    else if (m.data.kind === 'bye') close(m.from, false);
  };
  ws.onopen = function () { ctl({ t: 'ready' }); };
})();
</script>
</body>
</html>
