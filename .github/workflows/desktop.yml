name: Build macOS App

# TEMP fast loop for fix/macos-no-internet: macOS-only, every push to
# this branch builds the .app and drops it in workflow artifacts.
# Restore desktop.yml from main before merging.
on:
  push:
    branches:
      - fix/macos-no-internet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      # ditto preserves the .app bundle layout + framework symlinks
      # (upload-artifact alone flattens/breaks them → dyld "Ass.framework
      # not valid / library load disallowed" on launch). --keepParent
      # keeps the top-level lastwave_desktop.app wrapper.
      - name: Compress macOS Bundle
        run: |
          ditto -c -k --keepParent "build/macos/Build/Products/Release/lastwave_desktop.app" "LastWave-Desktop-macos.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          path: LastWave-Desktop-macos.zip
