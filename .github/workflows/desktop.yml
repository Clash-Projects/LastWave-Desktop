name: Build and Release Desktop Apps

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - '**.md'
      - '**.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config patchelf binutils \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libayatana-appindicator3-dev libasound2-dev libmpv-dev mpv \
            libkeybinder-3.0-dev libwebkit2gtk-4.1-dev glib-networking

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Release builds need the addon backend key: CI has no .env
      # (gitignored), so the repo secret ADDON_CLIENT_SECRET is written
      # to .env here. GitHub masks the value in logs; when unset the
      # key stays empty and addon calls fail closed server-side.
      # (Last.fm is BYOK and LYRICS_API_KEY is unused — nothing else
      # needs injecting.)
      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      # - name: Run analyzer & tests
      #   run: |
      #     flutter analyze --no-fatal-infos
      #     flutter test

      - name: Build Linux app
        run: flutter build linux --release

      # Portable AppImage, release-only (v* tags). linuxdeploy vendors the
      # full ldd closure (GTK, WebKit2GTK, libmpv) into the image.
      # ORDER: must run BEFORE `Normalize libmpv linkage` — linuxdeploy
      # resolves deps via ldd on this host, so it needs the pristine .so.1
      # linkage (22.04 has no .so.2) to find and bundle libmpv.
      # Icon must stay 512px max and named lastwave.png (matches desktop
      # Icon=lastwave by basename; linuxdeploy rejects anything else).
      - name: Build AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Building AppImage for version $VERSION"
          TOOLS="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$TOOLS" AppDir/usr/bin
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          wget -q -O "$TOOLS/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O "$TOOLS/linuxdeploy-plugin-gtk.sh" https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          wget -q -O "$TOOLS/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$TOOLS/linuxdeploy" "$TOOLS/linuxdeploy-plugin-gtk.sh" "$TOOLS/appimagetool"
          export PATH="$TOOLS:$PATH"
          export ARCH=x86_64
          # hotkey_manager_linux links libkeybinder-3.0.so.0 at runtime
          # (same reason nfpm deb/rpm declare it as a dependency): force
          # it into the image so global hotkeys work on distros that
          # don't ship keybinder3. Resolved via ldconfig with the
          # Ubuntu multiarch path as fallback.
          KEYBINDER_LIB="$(ldconfig -p 2>/dev/null | grep -m1 'libkeybinder-3.0.so.0 ' | awk '{print $NF}')"
          if [ -z "$KEYBINDER_LIB" ]; then
            KEYBINDER_LIB="/usr/lib/x86_64-linux-gnu/libkeybinder-3.0.so.0"
          fi
          echo "Using keybinder lib: $KEYBINDER_LIB"
          ls -la "$KEYBINDER_LIB"
          "$TOOLS/linuxdeploy" --appimage-extract-and-run \
            --appdir AppDir \
            -d linux/packaging/lastwave-appimage.desktop \
            -i linux/packaging/lastwave.png \
            --plugin gtk \
            --library "$KEYBINDER_LIB"
          # linuxdeploy should have vendored keybinder via --library
          # above (or via the hotkey plugin's NEEDED entry); verify so
          # a silently-missing lib never ships. Fall back to a manual
          # copy if the deploy step didn't place it.
          if ! ls AppDir/usr/lib/libkeybinder-3.0.so* >/dev/null 2>&1; then
            echo "::warning::linuxdeploy did not vendor libkeybinder, copying manually"
            cp -a "$KEYBINDER_LIB" AppDir/usr/lib/
          fi
          echo "--- vendored keybinder:"
          ls -la AppDir/usr/lib/libkeybinder*
          # Dart dlopens UNVERSIONED names first (media_kit: libmpv.so,
          # sqflite: libsqlite3.so) but linuxdeploy vendors only SONAMEs.
          # Without these, the opens hit host -devel symlinks => a second
          # copy of the lib (loader dedups by file, not name) => SIGSEGV.
          # Same inode => one instance everywhere.
          ln -sf libmpv.so.2 AppDir/usr/lib/libmpv.so
          ln -sf libsqlite3.so.0 AppDir/usr/lib/libsqlite3.so
          # WebKit2GTK helpers: libwebkit2gtk-4.1.so.0 spawns
          # WebKitNetworkProcess/WebKitWebProcess/WebKitGPUProcess from a
          # compile-time absolute path (/usr/lib/x86_64-linux-gnu/
          # webkit2gtk-4.1 on Ubuntu). linuxdeploy bundles the .so (via the
          # webview plugin's NEEDED chain) but NOT the helper executables,
          # so off-Ubuntu the spawn fails with "No such file or directory"
          # and WebKit SIGTRAPs the whole app. WEBKIT_EXEC_PATH was removed
          # upstream, so ship the helpers and byte-patch the path (below).
          WEBKIT_SRC="/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          WEBKIT_DST="AppDir/usr/lib/webkit2gtk-4.1"
          if [ ! -d "$WEBKIT_SRC" ]; then
            echo "::error::WebKit helper dir missing: $WEBKIT_SRC"
            exit 1
          fi
          mkdir -p "$WEBKIT_DST"
          cp -a "$WEBKIT_SRC"/. "$WEBKIT_DST/"
          find "$WEBKIT_DST" -type f -perm -111 -print0 | while IFS= read -r -d '' elf; do
            if file "$elf" | grep -q ELF; then
              patchelf --set-rpath '$ORIGIN/..' "$elf" 2>/dev/null || true
            fi
          done
          echo "--- vendored webkit helpers:"
          ls -la "$WEBKIT_DST"
          # GIO TLS modules: the gtk plugin copies libgio but not the
          # $libdir/gio/modules dir holding glib-networking's
          # libgiognutls.so. Without it WebKit reports "TLS is not
          # available" on the first HTTPS request off-Debian (masked on
          # Ubuntu by the host fallback path).
          GIO_SRC="/usr/lib/x86_64-linux-gnu/gio/modules"
          GIO_DST="AppDir/usr/lib/gio/modules"
          if [ ! -d "$GIO_SRC" ]; then
            echo "::error::GIO modules dir missing: $GIO_SRC (is glib-networking installed?)"
            exit 1
          fi
          mkdir -p "$GIO_DST"
          cp -a "$GIO_SRC"/. "$GIO_DST/"
          find "$GIO_DST" -name '*.so' -print0 | while IFS= read -r -d '' so; do
            patchelf --set-rpath '$ORIGIN/../..' "$so" 2>/dev/null || true
          done
          echo "--- vendored GIO modules:"
          ls -la "$GIO_DST"
          # Byte-patch the hardcoded helper path inside the bundled
          # libwebkit: the /tmp replacement must fit (NUL-padded when
          # shorter). Fails the job if the string is absent or the
          # replacement is too long, so a broken image never ships.
          python3 - "AppDir/usr/lib/libwebkit2gtk-4.1.so*" "/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1" "/tmp/.lastwave-webkit/webkit2gtk-4.1" <<'PY'
          import glob, os, sys
          lib_pattern, old, new = sys.argv[1], sys.argv[2].encode(), sys.argv[3].encode()
          if len(new) > len(old):
              sys.exit(f"FATAL: replacement {new!r} longer than original {old!r}")
          padded = new + b'\x00' * (len(old) - len(new))
          total = 0
          for path in glob.glob(lib_pattern):
              if os.path.islink(path):
                  continue
              data = open(path, 'rb').read()
              count = data.count(old)
              if count:
                  open(path, 'wb').write(data.replace(old, padded))
                  print(f"Patched {count} occurrence(s) in {path}")
                  total += count
          if total == 0:
              sys.exit(f"FATAL: hardcoded WebKit path {old!r} not found in {lib_pattern}")
          PY
          # Custom AppRun wrapper: keep linuxdeploy's generated AppRun as
          # AppRun.real and symlink the patched /tmp helper path at the
          # bundled helpers before launch. Also export the bundled GIO
          # module dir and disable WebKit's bubblewrap sandbox (its fresh
          # mount namespace cannot see the AppImage FUSE mount, so helpers
          # spawned inside it can't reach the bundle; standard practice for
          # AppImage-packaged WebKitGTK). No `set -e`: wrapper failures
          # must fall through to the real AppRun, never block launch.
          mv AppDir/AppRun AppDir/AppRun.real
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          if [ -d "$HERE/usr/lib/webkit2gtk-4.1" ]; then
            mkdir -p /tmp/.lastwave-webkit
            ln -snf "$HERE/usr/lib/webkit2gtk-4.1" /tmp/.lastwave-webkit/webkit2gtk-4.1
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          fi
          if [ -d "$HERE/usr/lib/gio/modules" ]; then
            export GIO_MODULE_DIR="$HERE/usr/lib/gio/modules"
          fi
          exec "$HERE/AppRun.real" "$@"
          EOF
          chmod +x AppDir/AppRun
          echo "--- AppRun wrapper:"
          cat AppDir/AppRun
          "$TOOLS/appimagetool" --appimage-extract-and-run \
            AppDir "lastwave_${VERSION}_x86_64.AppImage"
          ls -la "lastwave_${VERSION}_x86_64.AppImage"

      # Ubuntu 22.04 ships mpv 0.34 whose SONAME is libmpv.so.1, so the
      # source-built media_kit plugins record NEEDED libmpv.so.1 — which
      # exists on NO modern distro (24.04+, Fedora, Arch ship only
      # .so.2) and the loader dies before main(). Retarget the two
      # shims to .so.2: ABI-safe, they use only stable render/event
      # APIs present in .so.2 (verified against mpv 0.41), and Dart's
      # own loader already prefers .so.2. Fails the job if .so.1
      # survives. (22.04 itself has no .so.2 — see release notes.)
      - name: Normalize libmpv linkage
        run: |
          BUNDLE="build/linux/x64/release/bundle/lib"
          for f in "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so; do
            if objdump -p "$f" | grep -q "NEEDED.*libmpv.so.1"; then
              echo "Retargeting $f: libmpv.so.1 -> libmpv.so.2"
              patchelf --replace-needed libmpv.so.1 libmpv.so.2 "$f"
            fi
          done
          echo "--- NEEDED libmpv after normalize:"
          objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so | grep "NEEDED.*libmpv"
          if objdump -p "$BUNDLE"/libmedia_kit_video_plugin.so "$BUNDLE"/libmedia_kit_native_event_loop.so | grep -q "NEEDED.*libmpv.so.1"; then
            echo "::error::libmpv.so.1 linkage survived normalization"
            exit 1
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Linux
          path: build/linux/x64/release/bundle/

      # System packages are release-only (v* tags): PR/push builds
      # stop at the raw bundle above.
      - name: Setup Go (nFPM)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build deb/rpm packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "Packaging version $VERSION"
          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager deb --target ./lastwave_${VERSION}_amd64.deb
          ~/go/bin/nfpm package --config linux/packaging/nfpm.yaml --packager rpm --target ./lastwave_${VERSION}_x86_64.rpm
          ls -la lastwave_${VERSION}_amd64.deb lastwave_${VERSION}_x86_64.rpm

      - name: Upload Linux Packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Linux-Packages
          path: |
            lastwave_*_amd64.deb
            lastwave_*_x86_64.rpm

      - name: Upload Linux AppImage
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Linux-AppImage
          path: lastwave_*_x86_64.AppImage

  build-windows:
    name: Build Windows Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Windows
          path: build\windows\x64\runner\Release\

      # The single-file installer is release-only (v* tags): PR/push
      # builds stop at the raw Release folder above.
      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$ver" windows\installer.iss
          Get-ChildItem build\windows\installer\

      - name: Upload Windows Installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Installer
          path: build\windows\installer\lastwave_*.exe

      # Portable zip is release-only (v* tags): the raw Release folder
      # above zipped as-is (lastwave_desktop.exe + bundled DLLs/data),
      # no install step — run in place.
      - name: Build Windows portable zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $zip = "lastwave_${ver}_windows-x86_64-portable.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zip -Force
          Get-ChildItem $zip

      - name: Upload Windows Portable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Portable
          path: lastwave_*_windows-*-portable.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # NOTE: download-artifact `pattern` splits on newlines, NOT
      # commas — a comma-separated pattern matches nothing, dist stays
      # empty, and the release publishes with zero binaries. So each
      # tag artifact is downloaded by exact name (a missing artifact
      # fails its step loudly instead of publishing an empty release).
      # Assets ride the release as raw files:
      #   lastwave_<ver>_amd64.deb
      #   lastwave_<ver>_x86_64.rpm
      #   lastwave_<ver>_x86_64.AppImage (portable Linux)
      #   lastwave_<ver>_windows-x86_64-setup.exe (installer)
      #   lastwave_<ver>_windows-x86_64-portable.zip (portable)
      #   lastwave_<ver>_macos-arm64.zip (macOS stays a zip — a bare
      #     .app bundle isn't shippable).
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Windows-Installer
          path: dist

      - name: Download Windows portable
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Windows-Portable
          path: dist

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Linux-Packages
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Linux-AppImage
          path: dist

      - name: Download macOS archive
        uses: actions/download-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          path: dist

      - name: List release files
        run: find dist -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # macOS ships as a plain zip archive: no installer (unsigned macOS
  # zips Gatekeeper-block on other Macs — see release notes — but the
  # archive rides along on the Release for anyone who wants it.
  build-macos:
    name: Build macOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write .env from secrets
        run: echo "ADDON_CLIENT_SECRET=${{ secrets.ADDON_CLIENT_SECRET }}" > .env

      - name: Generate Obfuscated Secrets
        run: dart tool/obfuscate_secrets.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Compress macOS Bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "build/macos/Build/Products/Release/lastwave_desktop.app" "lastwave_${VERSION}_macos-arm64.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-macOS
          path: lastwave_*_macos-*.zip
